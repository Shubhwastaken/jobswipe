name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # DATABASE_URL is provided as a repo/environment secret. Without it the
        # DB-backed tests skip themselves (see tests/conftest.py); the pure-unit
        # tests still run. A test FAILURE always fails the build — no
        # continue-on-error, no soft-fail.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: ci-test-secret
        run: pytest -v
